[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zero-gaze"
version = "0.1.0"
description = "Autonomous ML paper to replication plan agent powered by LangGraph"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Riya Shandilya", email = "shandilyariya384@gmail.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pymupdf4llm>=0.0.17",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zero_gaze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
